name: codeql

# Static security analysis via GitHub Security Lab's curated Go query suite.
# Runs on every push to main, every PR targeting main, and a weekly Monday
# cron so any new query rules picked up between PRs still surface.
#
# Findings appear in the repo's Security tab → "Code scanning alerts".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read            # codeql needs to read workflow run data
      contents: read
      security-events: write   # upload code-scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          check-latest: true
          cache: true

      # github/codeql-action v4.37.1 — pinned to the tag's commit SHA. Bump
      # via Renovate / dependabot when a new query release ships.
      - name: initialize codeql
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          languages: go
          queries: security-and-quality

      - name: autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a

      - name: analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          category: '/language:go'
