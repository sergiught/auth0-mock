name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Minor-level pin: every setup-go step below pairs this with `check-latest:
  # true` so the newest 1.26.x is resolved fresh. Without check-latest, setup-go
  # reuses whatever 1.26.x the runner image happens to have cached, which lags
  # the current patch release — that is how CI ended up building on a Go with
  # known stdlib CVEs while govulncheck (correctly) failed every PR.
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.13.1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (golangci-lint + openapi drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      # golangci/golangci-lint-action v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: -c .golangci.yaml ./...
      - name: go mod verify
        run: go mod verify
      - name: check go.mod / go.sum drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: regenerate openapi spec
        run: make openapi
      - name: check openapi spec is up to date
        run: git diff --exit-code api/auth0-mock.openapi.json

  test:
    name: test (-race, coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix catches toolchain drift between the pinned-current and
        # stable channels — cheap insurance for a library/server. The first
        # entry (env.GO_VERSION) is what the Makefile / Dockerfile pin to;
        # the second tracks whatever Go upstream calls "stable" today.
        go-version: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true
      - name: make test-cover
        run: make test-cover
      - name: upload coverage to Codecov (unit)
        # Only the pinned-Go run uploads; otherwise the matrix double-counts.
        if: matrix.go-version == '1.26'
        # codecov/codecov-action v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit.out
          flags: unit
          fail_ci_if_error: false

  test-features:
    name: godog acceptance suite (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: make test-features-cover
        # GODOG_FORMAT lets the suite emit pretty (for log readability)
        # + junit (for the failures-as-annotations artifact below)
        # without changing default local behaviour.
        env:
          GODOG_FORMAT: 'pretty,junit:godog-report.xml'
        run: make test-features-cover
      - name: upload godog junit report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: godog-junit-report
          path: ./cmd/api/godog-report.xml
          if-no-files-found: warn
          retention-days: 14
      - name: upload coverage to Codecov (features)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/features.out
          flags: features
          fail_ci_if_error: false

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: make vuln
        run: make vuln
