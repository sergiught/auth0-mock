name: release

on:
  push:
    branches: [main]

  # Manual re-publish of a tag whose goreleaser job failed.
  #
  # "Re-run failed jobs" in the Actions UI is not enough: it checks the tag
  # back out, so it replays the exact tree that failed, and the tag itself
  # can't be re-pointed at a fixed commit once proxy.golang.org has cached
  # the version → commit mapping. This path builds the tagged source but
  # takes .goreleaser.yaml from the branch you dispatch it on, so a packaging
  # fix can be applied to an already-cut release. Signing still runs from
  # release.yml, so the cosign certificate identity matches the one the
  # verify instructions in .goreleaser.yaml and README.md expect.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to re-publish artifacts for, e.g. v0.232.0'
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  GORELEASER_VERSION: 'v2.4.5'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. release-please ───────────────────────────────────────────────────
  #
  # On every push to main, release-please either opens/updates a "Release PR"
  # (collecting all conventional commits since the last tag) or — if the
  # current push IS the merged Release PR — cuts the tag and creates the
  # GitHub release with the generated CHANGELOG as the body.
  #
  # release_created=true only on the second case; that's what gates goreleaser.
  #
  # Skipped entirely on workflow_dispatch: that path re-publishes a tag that
  # already exists, and letting release-please run would risk cutting a new
  # one as a side effect of repairing an old one.
  release-please:
    name: release-please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags/releases
      pull-requests: write   # open/update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
    steps:
      # googleapis/release-please-action v5.0.0
      #
      # Uses RELEASE_PLEASE_TOKEN (a fine-grained PAT with Contents +
      # Pull-requests write) rather than the default GITHUB_TOKEN. GitHub
      # silently skips `push` / `pull_request` workflows for events
      # triggered by GITHUB_TOKEN (recursion guard), which means the Release
      # PR opened with the default token gets no CI checks. Using a PAT
      # makes the PR look like it came from a real user, so ci.yml fires
      # normally.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token:         ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file:   release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2. goreleaser ───────────────────────────────────────────────────────
  #
  # Runs only when release-please cut a real release. Checks out the freshly
  # created tag, builds linux/darwin × amd64/arm64 archives, pushes multi-arch
  # Docker manifests to Docker Hub and ghcr.io, and uploads binaries +
  # checksums to the existing GitHub release (append mode — does not touch
  # the release body that release-please wrote).
  goreleaser:
    name: goreleaser
    needs: release-please
    # `!cancelled()` rather than a plain `needs...` check because on
    # workflow_dispatch release-please is skipped, and a skipped `needs`
    # would otherwise skip this job too. A *failed* release-please still
    # blocks: it leaves release_created empty, and the event isn't a
    # workflow_dispatch, so neither branch of the condition holds.
    if: >-
      ${{ !cancelled()
          && (needs.release-please.outputs.release_created == 'true'
              || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release artifacts to the GitHub release
      packages: write   # push images to ghcr.io
      id-token: write   # cosign keyless signing via OIDC
    # Hoist DOCKERHUB_USERNAME to job-level env so step `if:` checks can read
    # it as `env.DOCKERHUB_USERNAME`. The `secrets` context isn't allowed in
    # step-level `if:` expressions — using it makes the whole workflow fail
    # to register (silently, runs end at 0s).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # The tag being released: cut by release-please on a push, named by
      # hand on a re-publish.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0   # full history so goreleaser can compute ldflag values
          # Standard supply-chain hardening: don't leave the workflow token
          # in .git/config where any subsequent action step (goreleaser,
          # cosign, syft, …) could read it. Each step passes its required
          # token explicitly via env.
          persist-credentials: false

      # Re-publish path only. The tag was checked out above, so the tree still
      # carries the .goreleaser.yaml that failed; swap in the one from the ref
      # this run was dispatched on. Only that single file moves — every
      # tracked source file, and so the binary and the commit baked into its
      # ldflags, stays exactly as tagged. Fetching by SHA needs no credentials
      # against a public repo, which is why persist-credentials stays off.
      - name: apply packaging config from ${{ github.ref_name }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- .goreleaser.yaml
          echo "::group::.goreleaser.yaml diff vs $RELEASE_TAG"
          git --no-pager diff -- .goreleaser.yaml
          echo "::endgroup::"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # docker/setup-qemu-action v4.2.0 — enables arm64 build on amd64 runner
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: linux/amd64,linux/arm64

      # docker/setup-buildx-action v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # sigstore/cosign-installer v4.1.2 — keyless signing via the workflow's
      # OIDC token. Goreleaser invokes `cosign sign-blob` per the signs block
      # in .goreleaser.yaml and `cosign sign` per docker_signs. Both are on
      # the Cosign v3 CLI: sign-blob emits a Sigstore bundle, image signing
      # was unaffected by the v3 flag changes.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.3'

      # anchore/sbom-action/download-syft v0.24.0 — syft is required on PATH so
      # the sboms block in .goreleaser.yaml can generate SPDX-JSON SBOMs for
      # each release archive.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: 'v1.18.1'

      # docker/login-action v4.4.0
      # Gated on DOCKERHUB_USERNAME so first-release / fork runs without
      # Docker Hub creds publish to GHCR only instead of aborting the
      # whole workflow when docker-login fails fast on empty creds.
      # Goreleaser's docker.io image_templates simply fail to push if
      # the login was skipped — acceptable for a GHCR-only release.
      - name: log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser/goreleaser-action v7.2.3
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # --skip=validate on the re-publish path only: swapping in the
          # packaging config leaves the worktree dirty, which goreleaser
          # otherwise refuses to release from. The release itself is still
          # append mode, so re-running against a tag that already has some
          # assets tops it up rather than rewriting the body.
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--skip=validate' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the version explicitly instead of letting goreleaser derive it
          # from `git describe`, which is ambiguous once the worktree is dirty.
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          # Passed through so .goreleaser.yaml's dockers[].skip_push template
          # can detect whether Docker Hub creds are available and skip the
          # docker.io push when they aren't (envOrDefault check). GHCR push
          # is unaffected and always proceeds.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
