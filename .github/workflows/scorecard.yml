name: scorecard

# OpenSSF Scorecard — supply-chain security posture scoring.
# Results publish to the public OpenSSF API (securityscorecards.dev) and
# surface in the repo Security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1' # weekly Monday
  workflow_dispatch:
  push:
    branches: [main]

# Top-level least privilege; write scopes are granted only to the job below.
permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the OpenSSF API (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # PAT with admin:read so the Branch-Protection check can read the
          # rules on main (the default GITHUB_TOKEN can't, leaving it as an
          # inconclusive -1). Falls back gracefully if the secret is unset.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
      - name: upload sarif to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
